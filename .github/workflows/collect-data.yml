name: Collect official source documents

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-source-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Immutable SHAs resolved read-only from official action repositories.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned document parsers
        run: python -m pip install --disable-pip-version-check -r data/requirements-ingestion.txt
      - name: Validate collector and extraction pipeline offline
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Collect documents and explicitly mapped review candidates
        run: python scripts/collect_sources.py --manifest data/collection-manifest.json --output-dir .local/collection --extract
      - name: Retain archives and provenance even after collection failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: official-source-collection-${{ github.run_id }}
          path: .local/collection/
          if-no-files-found: warn
          retention-days: 14
